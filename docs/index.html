<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>NEXO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #000;
    color: #7dd3fc;
    font-family: Arial, sans-serif;
    height: 100vh;
    overflow: hidden;
  }

  #pantalla-bienvenida {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    background: #000;
    position: relative;
  }
  #titulo-nexo {
    font-family: 'Quicksand', sans-serif;
    font-weight: 600;
    font-size: 26px;
    letter-spacing: 6px;
    color: #3ecbff;
    text-shadow: 0 0 10px #3ecbff;
    margin-bottom: 20px;
  }
  #cara-robot {
    width: 220px;
    height: 220px;
    cursor: pointer;
  }
  .ojo {
    fill: #3ecbff;
    filter: drop-shadow(0 0 8px #3ecbff);
    transition: all 0.4s ease;
  }
  .pupila {
    fill: #041722;
    transition: opacity 0.3s ease;
  }
  .sorprendido .pupila { transform: scale(1.3); }
  .somnoliento .pupila, .dormido .pupila { opacity: 0; }
  .guino .ojo-der { transform: scaleY(0.1); transform-origin: center; }
  .guino .pupila-der { opacity: 0; }
  .parpado {
    stroke: #3ecbff;
    stroke-width: 6;
    fill: none;
    stroke-linecap: round;
    display: none;
    filter: drop-shadow(0 0 6px #3ecbff);
  }
  .boca {
    stroke: #3ecbff;
    stroke-width: 6;
    fill: none;
    stroke-linecap: round;
    filter: drop-shadow(0 0 6px #3ecbff);
    transition: all 0.4s ease;
  }
  .zzz {
    fill: #3ecbff;
    font-size: 22px;
    opacity: 0;
    filter: drop-shadow(0 0 6px #3ecbff);
  }

  .feliz .boca { d: path("M 55 135 Q 100 180 145 135"); }
  .sorprendido .boca { d: path("M 85 150 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0"); }
  .sorprendido .ojo { transform: scale(1.15); }
  .somnoliento .ojo { transform: scaleY(0.15); transform-origin: center; }
  .somnoliento .boca { d: path("M 70 145 Q 100 155 130 145"); opacity: 0.6; }
  .dormido .ojo { display: none; }
  .dormido .parpado { display: block; }
  .dormido .boca { d: path("M 85 150 a 15 15 0 1 0 30 0 a 15 15 0 1 0 -30 0"); opacity: 0.7; }
  .dormido .zzz { animation: flotar 3s infinite; }
  .dormido .zzz.z2 { animation-delay: 1s; }
  .dormido .zzz.z3 { animation-delay: 2s; }
  .sonrisa-grande .boca { d: path("M 50 130 Q 100 195 150 130"); }
  .zigzag .boca { d: path("M 55 140 L 70 150 L 85 140 L 100 150 L 115 140 L 130 150 L 145 140"); }
  .pensativo .boca { d: path("M 70 148 Q 100 152 130 142"); }
  .pensativo .ojo { transform: scale(0.9); transform-origin: center; }

  @keyframes flotar {
    0% { opacity: 0; transform: translateY(0) scale(0.7); }
    30% { opacity: 1; }
    100% { opacity: 0; transform: translateY(-40px) scale(1.1); }
  }

  #campos-conexion {
    display: flex;
    flex-direction: column;
    gap: 10px;
    margin-top: 24px;
    width: 220px;
  }
  #campos-conexion input {
    background: transparent;
    border: 2px solid #3ecbff;
    color: #3ecbff;
    padding: 10px 14px;
    border-radius: 20px;
    font-size: 14px;
    font-family: Arial, sans-serif;
    text-align: center;
    outline: none;
  }
  #campos-conexion input::placeholder {
    color: #3ecbff;
    opacity: 0.5;
  }
  #boton-conectar {
    margin-top: 16px;
    padding: 14px 36px;
    font-size: 18px;
    background: transparent;
    color: #3ecbff;
    border: 2px solid #3ecbff;
    border-radius: 30px;
    cursor: pointer;
  }
  #boton-conectar:hover {
    background: #3ecbff;
    color: #000;
  }
  #estado-texto {
    margin-top: 20px;
    font-size: 14px;
    color: #7dd3fc;
    opacity: 0.8;
  }

  #esquina-reloj {
    position: fixed;
    bottom: 24px;
    left: 24px;
    opacity: 0.35;
    color: #7dd3fc;
    font-size: 13px;
    line-height: 1.4;
    pointer-events: none;
  }
  #esquina-reloj .hora { font-size: 22px; font-weight: bold; }

  #esquina-cielo {
    position: fixed;
    top: 24px;
    right: 24px;
    opacity: 0.35;
    pointer-events: none;
  }
  #esquina-cielo svg { width: 36px; height: 36px; }

  #pantalla-llamada {
    display: none;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background: #000;
    flex-direction: column;
  }
  #video-principal-contenedor {
    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    background: #000;
  }
  #video-principal {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    background: #000;
  }
  #etiqueta-principal {
    position: absolute;
    bottom: 10px;
    left: 10px;
    background: rgba(0,0,0,0.55);
    padding: 4px 12px;
    border-radius: 6px;
    font-size: 13px;
    color: #7dd3fc;
    font-family: Arial, sans-serif;
  }
  #aviso-esperando {
    display: none;
    position: absolute;
    inset: 0;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 20px;
    color: #7dd3fc;
    opacity: 0.6;
    font-family: Arial, sans-serif;
    font-size: 15px;
  }
  #datos-llamada {
    position: absolute;
    top: 12px;
    left: 12px;
    background: rgba(0,0,0,0.5);
    padding: 8px 14px;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.5;
  }
  #fila-miniaturas {
    flex: 0 0 20%;
    display: flex;
    gap: 8px;
    padding: 8px;
    overflow: auto;
    background: #000;
    transition: flex-basis 0.3s ease;
  }
  .miniatura {
    position: relative;
    flex: 1 1 0;
    min-width: 64px;
    min-height: 48px;
    background: #111;
    border-radius: 8px;
    overflow: hidden;
    border: 2px solid transparent;
    transition: border-color 0.2s ease, box-shadow 0.2s ease;
    cursor: pointer;
  }
  .miniatura.hablando {
    border-color: #3ecbff;
    box-shadow: 0 0 10px #3ecbff;
  }
  .miniatura.activa {
    border-color: #7dd3fc;
  }
  .miniatura video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .miniatura .etiqueta-nombre {
    position: absolute;
    bottom: 2px;
    left: 4px;
    background: rgba(0,0,0,0.55);
    padding: 1px 6px;
    border-radius: 4px;
    font-size: 10px;
    color: #7dd3fc;
    font-family: Arial, sans-serif;
  }
  #controles-llamada {
    position: absolute;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    align-items: center;
    gap: 10px;
    padding: 10px 14px;
    background: rgba(0,0,0,0.55);
    border-radius: 40px;
  }
  #controles-llamada button {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  #boton-girar-camara {
    width: 36px;
    height: 36px;
    background: transparent;
    color: #7dd3fc;
    border: 1px solid rgba(125, 211, 252, 0.5);
    opacity: 0.8;
    align-self: center;
  }
  #boton-girar-camara:hover {
    opacity: 1;
    background: rgba(62, 203, 255, 0.15);
  }
  #boton-colgar {
    background: #e11d48;
    color: #fff;
    border: none;
  }
  #boton-colgar:hover {
    background: #be123c;
  }
  #boton-silenciar {
    background: transparent;
    color: #3ecbff;
    border: 2px solid #3ecbff;
  }
  #boton-silenciar:hover {
    background: rgba(62, 203, 255, 0.15);
  }
  #boton-silenciar.silenciado {
    background: #7dd3fc;
    color: #041722;
    border-color: #7dd3fc;
  }
  #boton-camara {
    background: transparent;
    color: #3ecbff;
    border: 2px solid #3ecbff;
  }
  #boton-camara:hover {
    background: rgba(62, 203, 255, 0.15);
  }
  #boton-camara.silenciado {
    background: #7dd3fc;
    color: #041722;
    border-color: #7dd3fc;
  }
  .miniatura.camara-apagada video {
    opacity: 0;
  }
  .miniatura.camara-apagada::after {
    content: "Cámara apagada";
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 6px;
    font-size: 9px;
    color: #7dd3fc;
    background: #111;
    font-family: Arial, sans-serif;
  }
  #video-principal-contenedor.camara-apagada #video-principal {
    opacity: 0;
  }
  #video-principal-contenedor.camara-apagada::after {
    content: "Cámara apagada";
    position: absolute;
    inset: 0;
    z-index: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #7dd3fc;
    font-family: Arial, sans-serif;
    font-size: 16px;
    background: #111;
  }

  /* Pantallas anchas en horizontal: miniaturas al costado en vez de abajo */
  @media (orientation: landscape) and (min-width: 700px) {
    #pantalla-llamada {
      flex-direction: row;
    }
    #fila-miniaturas {
      flex-direction: column;
    }
    .miniatura {
      min-width: unset;
      min-height: 64px;
    }
  }
</style>

<script>
const URL_SERVIDOR_SEÑALIZACION = "wss://nexo-salas-servidor.onrender.com";

const ICE_SERVERS = [
  { urls: "stun:stun.relay.metered.ca:80" },
  {
    urls: "turn:standard.relay.metered.ca:80",
    username: "2159484b4463174120df1655",
    credential: "Om2rSFYCd/QfWgPt"
  },
  {
    urls: "turn:standard.relay.metered.ca:443",
    username: "2159484b4463174120df1655",
    credential: "Om2rSFYCd/QfWgPt"
  }
];

const caraRobot = document.getElementById('cara-robot');
let temporizadorSomnoliento;
let temporizadorDormido;
let contextoAudio;

function obtenerAudio() {
  if (!contextoAudio) {
    contextoAudio = new (window.AudioContext || window.webkitAudioContext)();
  }
  return contextoAudio;
}

function sonidoBip(frecuencia, duracion) {
  const ctx = obtenerAudio();
  const osc = ctx.createOscillator();
  const volumen = ctx.createGain();
  osc.type = 'sine';
  osc.frequency.value = frecuencia;
  volumen.gain.setValueAtTime(0.08, ctx.currentTime);
  volumen.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duracion);
  osc.connect(volumen);
  volumen.connect(ctx.destination);
  osc.start();
  osc.stop(ctx.currentTime + duracion);
}

let osciladorRonquido = null;
function iniciarRonquido() {
  const ctx = obtenerAudio();
  osciladorRonquido = ctx.createOscillator();
  const volumen = ctx.createGain();
  osciladorRonquido.type = 'sine';
  osciladorRonquido.frequency.value = 90;
  volumen.gain.value = 0.03;
  osciladorRonquido.connect(volumen);
  volumen.connect(ctx.destination);
  osciladorRonquido.start();

  let subiendo = true;
  osciladorRonquido._intervalo = setInterval(() => {
    const ahora = ctx.currentTime;
    volumen.gain.linearRampToValueAtTime(subiendo ? 0.06 : 0.01, ahora + 0.8);
    subiendo = !subiendo;
  }, 800);
}
function detenerRonquido() {
  if (osciladorRonquido) {
    clearInterval(osciladorRonquido._intervalo);
    osciladorRonquido.stop();
    osciladorRonquido = null;
  }
}

function ponerEstado(estado) {
  caraRobot.className = '';
  if (estado) caraRobot.classList.add(estado);
  if (estado !== 'dormido') detenerRonquido();
}

function reiniciarTemporizadoresReposo() {
  clearTimeout(temporizadorSomnoliento);
  clearTimeout(temporizadorDormido);
  detenerRonquido();

  temporizadorSomnoliento = setTimeout(() => {
    ponerEstado('somnoliento');
  }, 8000);

  temporizadorDormido = setTimeout(() => {
    ponerEstado('dormido');
    iniciarRonquido();
  }, 25000);
}

caraRobot.addEventListener('click', () => {
  ponerEstado('feliz');
  sonidoBip(600, 0.15);
  reiniciarTemporizadoresReposo();
  setTimeout(() => ponerEstado(null), 1200);
});

document.addEventListener('keydown', () => {
  ponerEstado('sorprendido');
  sonidoBip(880, 0.1);
  reiniciarTemporizadoresReposo();
  setTimeout(() => ponerEstado(null), 800);
});

document.addEventListener('mousemove', reiniciarTemporizadoresReposo);

// ---------- GESTOS ALEATORIOS ----------
const gestosAleatorios = ['guino', 'sonrisa-grande', 'zigzag', 'pensativo'];

function programarGestoAleatorio() {
  const espera = 6000 + Math.random() * 9000;
  setTimeout(() => {
    if (caraRobot.className.trim() === '') {
      const gesto = gestosAleatorios[Math.floor(Math.random() * gestosAleatorios.length)];
      ponerEstado(gesto);
      setTimeout(() => ponerEstado(null), 900);
    }
    programarGestoAleatorio();
  }, espera);
}
programarGestoAleatorio();

const pupilaIzq = document.querySelector('.pupila-izq');
const pupilaDer = document.querySelector('.pupila-der');
const centroOjoIzq = { x: 65, y: 90 };
const centroOjoDer = { x: 135, y: 90 };
const radioMovimiento = 6;

function moverPupilas(mouseX, mouseY) {
  const punto = caraRobot.createSVGPoint();
  punto.x = mouseX;
  punto.y = mouseY;
  const ctm = caraRobot.getScreenCTM();
  if (!ctm) return;
  const puntoSVG = punto.matrixTransform(ctm.inverse());

  [[pupilaIzq, centroOjoIzq], [pupilaDer, centroOjoDer]].forEach(([pupila, centro]) => {
    const dx = puntoSVG.x - centro.x;
    const dy = puntoSVG.y - centro.y;
    const distancia = Math.sqrt(dx * dx + dy * dy) || 1;
    const factor = Math.min(radioMovimiento, distancia) / distancia;
    pupila.setAttribute('transform', `translate(${dx * factor}, ${dy * factor})`);
  });
}
document.addEventListener('mousemove', (e) => moverPupilas(e.clientX, e.clientY));

let esDeNocheGlobal = false;
let hayLluviaGlobal = false;

function actualizarRelojYFecha() {
  const ahora = new Date();
  const horas = String(ahora.getHours()).padStart(2, '0');
  const minutos = String(ahora.getMinutes()).padStart(2, '0');
  document.getElementById('reloj-hora').textContent = `${horas}:${minutos}`;

  const dias = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
  const meses = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
  document.getElementById('reloj-fecha').textContent =
    `${dias[ahora.getDay()]}, ${ahora.getDate()} de ${meses[ahora.getMonth()]}`;

  esDeNocheGlobal = ahora.getHours() >= 20 || ahora.getHours() < 7;
  dibujarIconoCielo();
}

function dibujarIconoCielo() {
  const icono = document.getElementById('icono-cielo');
  if (hayLluviaGlobal) {
    icono.innerHTML =
      '<path d="M6 14a4 4 0 0 1 .5-7.97A5.5 5.5 0 0 1 17 8.5 3.5 3.5 0 0 1 16.5 15H6z" fill="#7dd3fc" opacity="0.7"/>' +
      '<line x1="8" y1="17" x2="7" y2="20" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>' +
      '<line x1="12" y1="17" x2="11" y2="21" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>' +
      '<line x1="16" y1="17" x2="15" y2="20" stroke="#7dd3fc" stroke-width="1.5" stroke-linecap="round"/>';
    return;
  }
  icono.innerHTML = esDeNocheGlobal
    ? '<path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a7 7 0 0 0 10.5 10.5z" fill="#7dd3fc" />'
    : '<circle cx="12" cy="12" r="5" fill="#facc15" /><g stroke="#facc15" stroke-width="1.5"><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/><line x1="4.2" y1="4.2" x2="6.3" y2="6.3"/><line x1="17.7" y1="17.7" x2="19.8" y2="19.8"/><line x1="4.2" y1="19.8" x2="6.3" y2="17.7"/><line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/></g>';
}

function consultarClima(lat, lon) {
  fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=precipitation,weather_code`)
    .then(respuesta => respuesta.json())
    .then(datos => {
      const codigo = datos.current.weather_code;
      const precipitacion = datos.current.precipitation;
      hayLluviaGlobal = precipitacion > 0 || (codigo >= 51 && codigo <= 99);
      dibujarIconoCielo();
    })
    .catch(() => {
    });
}

function iniciarClima() {
  if (!navigator.geolocation) return;
  navigator.geolocation.getCurrentPosition(
    (posicion) => {
      consultarClima(posicion.coords.latitude, posicion.coords.longitude);
      setInterval(() => consultarClima(posicion.coords.latitude, posicion.coords.longitude), 15 * 60 * 1000);
    },
    () => {
    }
  );
}

actualizarRelojYFecha();
setInterval(actualizarRelojYFecha, 30000);
iniciarClima();

reiniciarTemporizadoresReposo();

const pantallaBienvenida = document.getElementById('pantalla-bienvenida');
const pantallaLlamada = document.getElementById('pantalla-llamada');
const botonConectar = document.getElementById('boton-conectar');
const estadoTexto = document.getElementById('estado-texto');
const cronometroEl = document.getElementById('cronometro');
const estadoConexionEl = document.getElementById('estado-conexion');
const videoPrincipal = document.getElementById('video-principal');
const etiquetaPrincipal = document.getElementById('etiqueta-principal');
const filaMiniaturas = document.getElementById('fila-miniaturas');
const campoNombre = document.getElementById('campo-nombre');
const campoSala = document.getElementById('campo-sala');

let socket;
let streamLocal;
let miId = null;
let salaActual = '';
let nombreActual = '';
let segundos = 0;
let intervaloCronometro;
const conexiones = new Map(); // id del participante -> RTCPeerConnection
const streamsParticipantes = new Map(); // id -> { stream, nombre, esLocal }
let idActivo = null;
let momentoUltimoCambioActivo = 0;
let colgadoManualmente = false;
let wakeLock = null;
let camaraApagada = false;
let modoCamaraActual = 'user';

// ---------- EVITAR QUE SE APAGUE LA PANTALLA MIENTRAS DURA LA LLAMADA ----------
async function solicitarWakeLock() {
  try {
    if ('wakeLock' in navigator) {
      wakeLock = await navigator.wakeLock.request('screen');
    }
  } catch (e) {
    // si el navegador no lo permite, no pasa nada, seguimos sin esto
  }
}
function liberarWakeLock() {
  if (wakeLock) {
    wakeLock.release().catch(() => {});
    wakeLock = null;
  }
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && streamLocal && !wakeLock) {
    solicitarWakeLock();
  }
});

// ---------- LEER PARAMETROS DE LA URL (sala, nombre, auto) ----------
const parametrosURL = new URLSearchParams(window.location.search);
const salaDesdeURL = parametrosURL.get('sala');
const nombreDesdeURL = parametrosURL.get('nombre');
const autoDesdeURL = parametrosURL.get('auto');

if (salaDesdeURL) campoSala.value = salaDesdeURL;
if (nombreDesdeURL) campoNombre.value = nombreDesdeURL;
if (!campoSala.value) campoSala.value = 'principal';

// Si no vino el nombre por la URL, usamos el ultimo que se guardo en este dispositivo
if (!nombreDesdeURL) {
  const nombreGuardado = localStorage.getItem('nexo_nombre');
  if (nombreGuardado) campoNombre.value = nombreGuardado;
}
if (!salaDesdeURL) {
  const salaGuardada = localStorage.getItem('nexo_sala');
  if (salaGuardada) campoSala.value = salaGuardada;
}

botonConectar.addEventListener('click', iniciarTodo);

// Si el link viene con auto=1 y ya trae nombre y sala, nos conectamos solos
if (autoDesdeURL === '1' && nombreDesdeURL && salaDesdeURL) {
  estadoTexto.textContent = 'Conectando automáticamente...';
  setTimeout(() => { iniciarTodo(); }, 600);
}

// ---------- QUIEN SE MUESTRA EN GRANDE (video principal) ----------
function marcarActivo(id, forzado) {
  // A nosotros mismos no nos mostramos en la pantalla grande, solo en la miniatura
  if (id === 'yo') return;

  const ahora = Date.now();
  if (id === idActivo) return;
  if (!forzado && ahora - momentoUltimoCambioActivo < 1500) return;

  const datos = streamsParticipantes.get(id);
  if (!datos) return;

  document.getElementById('aviso-esperando').style.display = 'none';
  videoPrincipal.srcObject = datos.stream;
  videoPrincipal.muted = !!datos.esLocal;
  etiquetaPrincipal.textContent = datos.esLocal ? `${datos.nombre} (vos)` : datos.nombre;

  const contenedorPrincipal = document.getElementById('video-principal-contenedor');
  contenedorPrincipal.classList.toggle('camara-apagada', datos.esLocal && camaraApagada);

  filaMiniaturas.querySelectorAll('.miniatura').forEach((mini) => {
    mini.classList.toggle('activa', mini.dataset.id === id);
  });

  idActivo = id;
  momentoUltimoCambioActivo = ahora;
}

// ---------- INDICADOR DE "QUIEN ESTA HABLANDO" (por cada miniatura) ----------
function monitorearHabla(stream, elementoMini, id) {
  const ctx = obtenerAudio();
  const fuente = ctx.createMediaStreamSource(stream);
  const analizador = ctx.createAnalyser();
  analizador.fftSize = 256;
  fuente.connect(analizador);
  const datos = new Uint8Array(analizador.frequencyBinCount);

  function actualizar() {
    if (!document.body.contains(elementoMini)) return;
    analizador.getByteFrequencyData(datos);
    const promedio = datos.reduce((a, b) => a + b, 0) / datos.length;
    const hablando = promedio > 12;
    elementoMini.classList.toggle('hablando', hablando);
    if (hablando) marcarActivo(id, false);
    requestAnimationFrame(actualizar);
  }
  actualizar();
}

// ---------- AGREGAR / QUITAR PARTICIPANTES (miniatura + video principal) ----------
function agregarParticipante(id, nombre, stream, esLocal) {
  streamsParticipantes.set(id, { stream, nombre, esLocal });

  let mini = filaMiniaturas.querySelector(`[data-id="${id}"]`);
  if (!mini) {
    mini = document.createElement('div');
    mini.className = 'miniatura';
    mini.dataset.id = id;

    const video = document.createElement('video');
    video.autoplay = true;
    video.playsInline = true;
    if (esLocal) video.muted = true;

    const etiqueta = document.createElement('div');
    etiqueta.className = 'etiqueta-nombre';
    etiqueta.textContent = esLocal ? `${nombre} (vos)` : nombre;

    mini.appendChild(video);
    mini.appendChild(etiqueta);
    if (!esLocal) {
      mini.addEventListener('click', () => marcarActivo(id, true));
    }
    filaMiniaturas.appendChild(mini);
  }

  mini.querySelector('video').srcObject = stream;
  monitorearHabla(stream, mini, id);

  if (!esLocal && !idActivo) marcarActivo(id, true);
  actualizarProporcionLayout();
}

function quitarParticipante(id) {
  streamsParticipantes.delete(id);
  const mini = filaMiniaturas.querySelector(`[data-id="${id}"]`);
  if (mini) mini.remove();

  if (idActivo === id) {
    idActivo = null;
    const siguienteId = [...streamsParticipantes.keys()].find((otroId) => otroId !== 'yo');
    if (siguienteId) {
      marcarActivo(siguienteId, true);
    } else {
      videoPrincipal.srcObject = null;
      etiquetaPrincipal.textContent = '';
      document.getElementById('aviso-esperando').style.display = 'flex';
    }
  }
  actualizarProporcionLayout();
}

// La fila de miniaturas ocupa mas espacio a medida que se suman participantes
// (20% con 1-2 personas, hasta 30% con 5 o mas), asi el video grande se ve
// bien sin importar cuanta gente haya en la sala.
function actualizarProporcionLayout() {
  const total = streamsParticipantes.size;
  let porcentaje;
  if (total <= 2) porcentaje = 20;
  else if (total === 3) porcentaje = 23;
  else if (total === 4) porcentaje = 26;
  else porcentaje = 30;
  filaMiniaturas.style.flexBasis = porcentaje + '%';
}

function actualizarEstadoSala() {
  const totalParticipantes = conexiones.size + 1; // +1 por uno mismo
  estadoConexionEl.textContent = `Sala "${salaActual}" — ${totalParticipantes} participante(s)`;
}

// ---------- CREAR UNA CONEXION WEBRTC CON UN PARTICIPANTE ----------
function crearConexionPeer(idRemoto, nombreRemoto, esIniciador) {
  const pc = new RTCPeerConnection({ iceServers: ICE_SERVERS });
  conexiones.set(idRemoto, pc);

  streamLocal.getTracks().forEach(track => {
    const remitente = pc.addTrack(track, streamLocal);
    if (track.kind === 'video') {
      const parametros = remitente.getParameters();
      if (!parametros.encodings) parametros.encodings = [{}];
      parametros.encodings[0].maxBitrate = 300000;
      parametros.degradationPreference = 'maintain-framerate';
      remitente.setParameters(parametros).catch(() => {});
    }
  });

  pc.ontrack = (evento) => {
    agregarParticipante(idRemoto, nombreRemoto, evento.streams[0], false);
  };

  pc.onicecandidate = (evento) => {
    if (evento.candidate) {
      socket.send(JSON.stringify({ tipo: 'candidato', para: idRemoto, candidato: evento.candidate }));
    }
  };

  pc.onconnectionstatechange = () => {
    actualizarEstadoSala();
  };

  if (esIniciador) {
    pc.createOffer().then((oferta) => {
      pc.setLocalDescription(oferta);
      socket.send(JSON.stringify({ tipo: 'oferta', para: idRemoto, oferta }));
    });
  }

  return pc;
}

// ---------- ICONOS DE LOS BOTONES (se intercambian segun el estado) ----------
const ICONO_MIC_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>';
const ICONO_MIC_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="11" rx="3"></rect><path d="M5 10a7 7 0 0 0 14 0"></path><line x1="12" y1="19" x2="12" y2="22"></line><line x1="3" y1="3" x2="21" y2="21"></line></svg>';
const ICONO_CAM_ON = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-4v12l-6-4"></path></svg>';
const ICONO_CAM_OFF = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="14" height="12" rx="2"></rect><path d="M16 10l6-4v12l-6-4"></path><line x1="2" y1="2" x2="22" y2="22"></line></svg>';

// ---------- SILENCIAR MICROFONO ----------
const botonSilenciar = document.getElementById('boton-silenciar');
let microfonoSilenciado = false;

botonSilenciar.addEventListener('click', () => {
  if (!streamLocal) return;
  microfonoSilenciado = !microfonoSilenciado;
  streamLocal.getAudioTracks().forEach(track => {
    track.enabled = !microfonoSilenciado;
  });
  botonSilenciar.innerHTML = microfonoSilenciado ? ICONO_MIC_OFF : ICONO_MIC_ON;
  botonSilenciar.title = microfonoSilenciado ? 'Activar micrófono' : 'Silenciar micrófono';
  botonSilenciar.classList.toggle('silenciado', microfonoSilenciado);
});

// ---------- APAGAR/PRENDER CAMARA ----------
const botonCamara = document.getElementById('boton-camara');

botonCamara.addEventListener('click', () => {
  if (!streamLocal) return;
  camaraApagada = !camaraApagada;
  streamLocal.getVideoTracks().forEach(track => {
    track.enabled = !camaraApagada;
  });
  botonCamara.innerHTML = camaraApagada ? ICONO_CAM_OFF : ICONO_CAM_ON;
  botonCamara.title = camaraApagada ? 'Activar cámara' : 'Apagar cámara';
  botonCamara.classList.toggle('silenciado', camaraApagada);

  const miMiniatura = filaMiniaturas.querySelector('[data-id="yo"]');
  if (miMiniatura) miMiniatura.classList.toggle('camara-apagada', camaraApagada);

  if (idActivo === 'yo') {
    document.getElementById('video-principal-contenedor').classList.toggle('camara-apagada', camaraApagada);
  }
});

// ---------- GIRAR CAMARA (frontal / trasera) ----------
const botonGirarCamara = document.getElementById('boton-girar-camara');

botonGirarCamara.addEventListener('click', async () => {
  if (!streamLocal) return;
  const nuevoModo = modoCamaraActual === 'user' ? 'environment' : 'user';

  try {
    const nuevoStream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { exact: nuevoModo },
        width: { ideal: 400 },
        height: { ideal: 300 },
        frameRate: { ideal: 15, max: 20 }
      },
      audio: false
    });

    const nuevaPistaVideo = nuevoStream.getVideoTracks()[0];
    const pistaViejaVideo = streamLocal.getVideoTracks()[0];

    // Reemplazamos la pista en cada conexion activa, sin cortar ni reconectar la llamada
    conexiones.forEach((pc) => {
      const remitente = pc.getSenders().find((s) => s.track && s.track.kind === 'video');
      if (remitente) remitente.replaceTrack(nuevaPistaVideo);
    });

    streamLocal.removeTrack(pistaViejaVideo);
    pistaViejaVideo.stop();
    streamLocal.addTrack(nuevaPistaVideo);

    // Refrescamos nuestra propia vista (miniatura y video principal si corresponde)
    const miMiniatura = filaMiniaturas.querySelector('[data-id="yo"] video');
    if (miMiniatura) miMiniatura.srcObject = streamLocal;
    if (idActivo === 'yo') videoPrincipal.srcObject = streamLocal;

    modoCamaraActual = nuevoModo;
  } catch (e) {
    console.log('No se pudo girar la cámara (puede que el dispositivo no tenga dos cámaras)', e);
  }
});

// ---------- INICIAR TODO: PEDIR CAMARA Y CONECTAR AL SERVIDOR ----------
async function iniciarTodo() {
  const nombre = campoNombre.value.trim() || 'Invitado';
  const sala = campoSala.value.trim() || 'principal';
  salaActual = sala;
  nombreActual = nombre;
  colgadoManualmente = false;

  localStorage.setItem('nexo_nombre', nombre);
  localStorage.setItem('nexo_sala', sala);

  estadoTexto.textContent = "Pidiendo acceso a cámara y micrófono...";

  streamLocal = await navigator.mediaDevices.getUserMedia({
    video: { width: { ideal: 400 }, height: { ideal: 300 }, frameRate: { ideal: 15, max: 20 } },
    audio: true
  });

  mostrarPantallaLlamada();
  agregarParticipante('yo', nombre, streamLocal, true);
  solicitarWakeLock();

  estadoTexto.textContent = "Conectando con el servidor...";
  conectarSeñalizacion(nombre, sala);
}

function limpiarConexionesRemotas() {
  conexiones.forEach((pc) => pc.close());
  conexiones.clear();

  streamsParticipantes.forEach((datos, id) => {
    if (id !== 'yo') streamsParticipantes.delete(id);
  });
  filaMiniaturas.querySelectorAll('.miniatura').forEach((mini) => {
    if (mini.dataset.id !== 'yo') mini.remove();
  });

  if (idActivo !== 'yo') {
    idActivo = null;
    marcarActivo('yo', true);
  }
}

function conectarSeñalizacion(nombre, sala) {
  limpiarConexionesRemotas();

  socket = new WebSocket(URL_SERVIDOR_SEÑALIZACION);

  socket.onopen = () => {
    socket.send(JSON.stringify({ tipo: 'unirse', sala, nombre }));
    estadoConexionEl.textContent = `Sala "${salaActual}" — 1 participante(s)`;
  };

  socket.onclose = () => {
    if (colgadoManualmente || !streamLocal) return;
    estadoConexionEl.textContent = 'Conexión perdida, reintentando...';
    setTimeout(() => {
      if (!colgadoManualmente && streamLocal) {
        conectarSeñalizacion(nombreActual, salaActual);
      }
    }, 3000);
  };

  socket.onmessage = async (evento) => {
    const datos = JSON.parse(evento.data);

    if (datos.tipo === 'sala-actual') {
      miId = datos.miId;
      datos.participantes.forEach((p) => {
        crearConexionPeer(p.id, p.nombre, true);
      });
      actualizarEstadoSala();
      return;
    }

    if (datos.tipo === 'nuevo-participante') {
      crearConexionPeer(datos.id, datos.nombre, false);
      actualizarEstadoSala();
      sonidoBip(700, 0.12);
      return;
    }

    if (datos.tipo === 'oferta') {
      let pc = conexiones.get(datos.de);
      if (!pc) pc = crearConexionPeer(datos.de, 'Participante', false);
      await pc.setRemoteDescription(datos.oferta);
      const respuesta = await pc.createAnswer();
      await pc.setLocalDescription(respuesta);
      socket.send(JSON.stringify({ tipo: 'respuesta', para: datos.de, respuesta }));
      return;
    }

    if (datos.tipo === 'respuesta') {
      const pc = conexiones.get(datos.de);
      if (pc) await pc.setRemoteDescription(datos.respuesta);
      return;
    }

    if (datos.tipo === 'candidato') {
      const pc = conexiones.get(datos.de);
      if (pc) {
        try {
          await pc.addIceCandidate(datos.candidato);
        } catch (e) {
          console.log('Error agregando candidato ICE', e);
        }
      }
      return;
    }

    if (datos.tipo === 'participante-salio') {
      const pc = conexiones.get(datos.id);
      if (pc) {
        pc.close();
        conexiones.delete(datos.id);
      }
      quitarParticipante(datos.id);
      actualizarEstadoSala();
      sonidoBip(400, 0.15);
      return;
    }
  };
}

function mostrarPantallaLlamada() {
  pantallaBienvenida.style.display = 'none';
  pantallaLlamada.style.display = 'flex';
  segundos = 0;
  intervaloCronometro = setInterval(() => {
    segundos++;
    const min = String(Math.floor(segundos / 60)).padStart(2, '0');
    const seg = String(segundos % 60).padStart(2, '0');
    cronometroEl.textContent = `${min}:${seg}`;
  }, 1000);
}

const botonColgar = document.getElementById('boton-colgar');
botonColgar.addEventListener('click', colgarLlamada);

function colgarLlamada() {
  colgadoManualmente = true;
  clearInterval(intervaloCronometro);
  liberarWakeLock();

  conexiones.forEach((pc) => pc.close());
  conexiones.clear();
  streamsParticipantes.clear();
  filaMiniaturas.innerHTML = '';
  videoPrincipal.srcObject = null;
  etiquetaPrincipal.textContent = '';
  idActivo = null;

  microfonoSilenciado = false;
  botonSilenciar.innerHTML = ICONO_MIC_ON;
  botonSilenciar.title = 'Silenciar micrófono';
  botonSilenciar.classList.remove('silenciado');
  camaraApagada = false;
  botonCamara.innerHTML = ICONO_CAM_ON;
  botonCamara.title = 'Apagar cámara';
  botonCamara.classList.remove('silenciado');

  if (streamLocal) {
    streamLocal.getTracks().forEach((track) => track.stop());
    streamLocal = null;
  }
  if (socket) {
    socket.close();
    socket = null;
  }

  pantallaLlamada.style.display = 'none';
  pantallaBienvenida.style.display = 'flex';
  estadoTexto.textContent = 'Esperando conexión...';
  ponerEstado(null);
  reiniciarTemporizadoresReposo();
}
